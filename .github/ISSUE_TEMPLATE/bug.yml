name: Bug report
description: A page captured wrong, a run failed, or output looks off.
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Exact command you ran
      placeholder: stm --json
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: What stm printed (paste the summary lines or the --json)
      render: text
    validations: { required: true }
  - type: input
    id: versions
    attributes:
      label: stm version · Node version · OS
      placeholder: 0.1.0 · v24.4.0 · macOS 26 / Windows 11 / Ubuntu 24.04
    validations: { required: true }
  - type: input
    id: framework
    attributes:
      label: Framework / how you run your app
      placeholder: Next.js 16 dev, Vite 8, Astro 6, Rails, Django, static…
    validations: { required: true }
  - type: textarea
    id: manifest
    attributes:
      label: manifest header + the failing page entries
      description: From screenshots/<snapshot>/manifest_<timestamp>.json: the top-level fields and only the `pages` entries that are wrong. Never paste secrets.
      render: json
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
