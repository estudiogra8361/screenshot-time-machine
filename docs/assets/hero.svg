<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 820" width="1640" height="820" role="img" aria-label="The stm command captures every page of a local app into a dated snapshot folder and reports that one page, slash pricing, changed since the last snapshot" text-rendering="geometricPrecision">
  <title>stm captures every page, then tells you which ones changed</title>

  <defs>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF9A1F" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#FF6600" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FF6600" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="heroLineTint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6600" stop-opacity="0.16"/>
      <stop offset="0.65" stop-color="#FF6600" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FF6600" stop-opacity="0"/>
    </linearGradient>

    <filter id="terminalShadow" x="-12%" y="-14%" width="124%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0A0E14" flood-opacity="0.30"/>
    </filter>
    <filter id="panelShadow" x="-12%" y="-10%" width="124%" height="126%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0A0E14" flood-opacity="0.12"/>
    </filter>
    <filter id="lineGlow" x="-14%" y="-90%" width="128%" height="280%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <path id="tick" d="M0 4.6 L3.7 8.2 L10 0.8" fill="none"/>
    <path id="folder" d="M0 3a3 3 0 0 1 3-3h5.6l2.6 2.8H17a3 3 0 0 1 3 3V13a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3z"/>
  </defs>

  <!-- warm light behind the composition -->
  <ellipse cx="880" cy="430" rx="680" ry="390" fill="url(#warmGlow)"/>

  <!-- ============ terminal (left, behind) ============ -->
  <g>
    <rect x="40" y="306" width="916" height="428" rx="16" fill="#0A0E14" stroke="#232C3A" stroke-width="1.5" filter="url(#terminalShadow)"/>
    <path d="M40 362 V322 A16 16 0 0 1 56 306 H940 A16 16 0 0 1 956 322 V362 Z" fill="#131A24"/>
    <line x1="40" y1="362" x2="956" y2="362" stroke="#232C3A" stroke-width="1"/>

    <circle cx="76" cy="334" r="5.5" fill="#F04E23"/>
    <circle cx="98" cy="334" r="5.5" fill="#FF9A1F"/>
    <circle cx="120" cy="334" r="5.5" fill="#FFC46B"/>

    <text x="498" y="339" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#8A97A8" text-anchor="middle" letter-spacing="0.4">stm</text>

    <!-- content -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="17">
      <text x="80" y="434" fill="#FF9A1F">$</text>
      <text x="100" y="434" fill="#E8EDF3">stm</text>

      <g stroke="#3DD68C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <use href="#tick" x="80" y="463"/>
        <use href="#tick" x="80" y="493"/>
        <use href="#tick" x="80" y="523"/>
        <use href="#tick" x="80" y="553"/>
      </g>

      <g fill="#E8EDF3">
        <text x="110" y="474">/</text>
        <text x="110" y="504">/products</text>
        <text x="110" y="534">/about</text>
        <text x="110" y="564">/pricing</text>
      </g>

      <g fill="#8A97A8" text-anchor="end">
        <text x="702" y="474">0.8s</text>
        <text x="702" y="504">0.9s</text>
        <text x="702" y="534">0.9s</text>
        <text x="702" y="564">1.1s</text>
      </g>

      <text x="80" y="624" fill="#E8EDF3">7 pages saved -&gt; screenshots/localhost-3000_2026-08-15_14-32/</text>

      <!-- the line the whole tool exists for -->
      <rect x="72" y="646" width="672" height="36" rx="10" fill="url(#heroLineTint)"/>
      <rect x="72" y="651" width="3" height="26" rx="1.5" fill="#FF6600"/>
      <text x="110" y="668" font-weight="700" fill="#FF9A1F" fill-opacity="0.55" filter="url(#lineGlow)">1 changed since last snapshot (Aug 12, 09:10): /pricing</text>
      <text x="110" y="668" font-weight="700" fill="#FF9A1F">1 changed since last snapshot (Aug 12, 09:10): /pricing</text>
    </g>
  </g>

  <!-- ============ file browser (right, in front) ============ -->
  <g>
    <rect x="900" y="110" width="700" height="600" rx="16" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1" filter="url(#panelShadow)"/>

    <!-- header -->
    <use href="#folder" x="928" y="133" fill="#FF6600"/>
    <text x="960" y="147" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A">screenshots</text>
    <text x="1572" y="146" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="end">3 snapshots</text>
    <line x1="900" y1="172" x2="1600" y2="172" stroke="#E9EDF2" stroke-width="1"/>

    <!-- snapshot folders -->
    <rect x="916" y="270" width="668" height="40" rx="10" fill="#FFF7ED" stroke="#FFEDD9" stroke-width="1"/>
    <use href="#folder" x="928" y="194" fill="#94A3B8" fill-opacity="0.45"/>
    <use href="#folder" x="928" y="238" fill="#94A3B8" fill-opacity="0.45"/>
    <use href="#folder" x="928" y="282" fill="#FF6600"/>
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13">
      <text x="964" y="207" fill="#475569">localhost-3000_2026-08-01_09-12</text>
      <text x="964" y="251" fill="#475569">localhost-3000_2026-08-08_18-40</text>
      <text x="964" y="295" fill="#0F172A">localhost-3000_2026-08-15_14-32</text>
    </g>

    <line x1="928" y1="332" x2="1572" y2="332" stroke="#E9EDF2" stroke-width="1"/>

    <!-- thumbnails -->
    <g fill="#94A3B8">
      <!-- index -->
      <rect x="928" y="364" width="196" height="128" rx="10" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1"/>
      <rect x="942" y="378" width="168" height="8" rx="4" fill-opacity="0.62"/>
      <rect x="942" y="396" width="168" height="34" rx="6" fill-opacity="0.20"/>
      <rect x="942" y="440" width="118" height="7" rx="3.5" fill-opacity="0.34"/>
      <rect x="942" y="453" width="86" height="7" rx="3.5" fill-opacity="0.34"/>
      <rect x="942" y="468" width="46" height="10" rx="5" fill-opacity="0.34"/>

      <!-- products -->
      <rect x="1152" y="364" width="196" height="128" rx="10" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1"/>
      <rect x="1166" y="378" width="168" height="8" rx="4" fill-opacity="0.62"/>
      <rect x="1166" y="396" width="50" height="46" rx="5" fill-opacity="0.20"/>
      <rect x="1225" y="396" width="50" height="46" rx="5" fill-opacity="0.20"/>
      <rect x="1284" y="396" width="50" height="46" rx="5" fill-opacity="0.20"/>
      <rect x="1166" y="450" width="36" height="6" rx="3" fill-opacity="0.34"/>
      <rect x="1225" y="450" width="36" height="6" rx="3" fill-opacity="0.34"/>
      <rect x="1284" y="450" width="36" height="6" rx="3" fill-opacity="0.34"/>
      <rect x="1166" y="463" width="24" height="6" rx="3" fill-opacity="0.34"/>
      <rect x="1225" y="463" width="24" height="6" rx="3" fill-opacity="0.34"/>
      <rect x="1284" y="463" width="24" height="6" rx="3" fill-opacity="0.34"/>

      <!-- about -->
      <rect x="1376" y="364" width="196" height="128" rx="10" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1"/>
      <rect x="1390" y="378" width="168" height="8" rx="4" fill-opacity="0.62"/>
      <rect x="1390" y="398" width="138" height="7" rx="3.5" fill-opacity="0.34"/>
      <rect x="1390" y="412" width="168" height="7" rx="3.5" fill-opacity="0.34"/>
      <rect x="1390" y="426" width="122" height="7" rx="3.5" fill-opacity="0.34"/>
      <rect x="1390" y="440" width="150" height="7" rx="3.5" fill-opacity="0.34"/>
      <rect x="1390" y="454" width="90" height="7" rx="3.5" fill-opacity="0.34"/>
      <rect x="1390" y="468" width="54" height="10" rx="5" fill-opacity="0.20"/>

      <!-- pricing (the changed page) -->
      <rect x="928" y="536" width="196" height="128" rx="10" fill="#FFFFFF" stroke="#FF6600" stroke-width="2"/>
      <rect x="942" y="550" width="168" height="8" rx="4" fill-opacity="0.62"/>
      <rect x="942" y="568" width="52" height="76" rx="6" fill-opacity="0.20"/>
      <rect x="1000" y="568" width="52" height="76" rx="6" fill="#FFEDD9"/>
      <rect x="1058" y="568" width="52" height="76" rx="6" fill-opacity="0.20"/>
      <rect x="950" y="580" width="34" height="6" rx="3" fill-opacity="0.34"/>
      <rect x="1008" y="580" width="34" height="6" rx="3" fill="#FF6600" fill-opacity="0.55"/>
      <rect x="1066" y="580" width="34" height="6" rx="3" fill-opacity="0.34"/>
      <rect x="950" y="592" width="22" height="6" rx="3" fill-opacity="0.34"/>
      <rect x="1008" y="592" width="22" height="6" rx="3" fill="#FF6600" fill-opacity="0.35"/>
      <rect x="1066" y="592" width="22" height="6" rx="3" fill-opacity="0.34"/>
      <rect x="950" y="620" width="36" height="12" rx="6" fill-opacity="0.34"/>
      <rect x="1008" y="620" width="36" height="12" rx="6" fill="#FF6600" fill-opacity="0.55"/>
      <rect x="1066" y="620" width="36" height="12" rx="6" fill-opacity="0.34"/>

      <!-- docs -->
      <rect x="1152" y="536" width="196" height="128" rx="10" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1"/>
      <rect x="1166" y="550" width="168" height="8" rx="4" fill-opacity="0.62"/>
      <rect x="1166" y="570" width="44" height="74" rx="5" fill-opacity="0.20"/>
      <rect x="1220" y="572" width="114" height="7" rx="3.5" fill-opacity="0.34"/>
      <rect x="1220" y="586" width="92" height="7" rx="3.5" fill-opacity="0.34"/>
      <rect x="1220" y="600" width="106" height="7" rx="3.5" fill-opacity="0.34"/>
      <rect x="1220" y="614" width="72" height="7" rx="3.5" fill-opacity="0.34"/>
      <rect x="1220" y="628" width="96" height="7" rx="3.5" fill-opacity="0.34"/>

      <!-- contact -->
      <rect x="1376" y="536" width="196" height="128" rx="10" fill="#FFFFFF" stroke="#E9EDF2" stroke-width="1"/>
      <rect x="1390" y="550" width="168" height="8" rx="4" fill-opacity="0.62"/>
      <rect x="1390" y="570" width="168" height="20" rx="6" fill-opacity="0.18"/>
      <rect x="1390" y="598" width="168" height="20" rx="6" fill-opacity="0.18"/>
      <rect x="1390" y="626" width="64" height="18" rx="6" fill-opacity="0.55"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#94A3B8">
      <text x="928" y="510">index_2026-08-15_14-32.png</text>
      <text x="1152" y="510">products_2026-08-15_14-32.png</text>
      <text x="1376" y="510">about_2026-08-15_14-32.png</text>
      <text x="928" y="682" fill="#FF6600">pricing_2026-08-15_14-32.png</text>
      <text x="1152" y="682">docs_2026-08-15_14-32.png</text>
      <text x="1376" y="682">contact_2026-08-15_14-32.png</text>
    </g>
  </g>
</svg>
